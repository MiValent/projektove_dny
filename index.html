<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Projektových Dnů 2026 | Gymnázium Slaný</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'media', 
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#0f766e',    
                            medium: '#0d9488',  
                            light: '#2dd4bf',   
                            cyan: '#06b6d4',    
                            yellow: '#facc15',  
                            yellowHover: '#eab308',
                            bg: '#f0fdfa'       
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <script src="https://unpkg.com/lucide@0.294.0"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
    </style>
</head>
<body class="bg-[#f0fdfa] text-slate-800 min-h-screen">
    <div id="root"></div>

    <script>
        const e = React.createElement;

        // Bezpečné ikony pro čistý JS
        const Icon = ({ name, className }) => {
            React.useEffect(() => { 
                if (window.lucide && typeof window.lucide.createIcons === 'function') {
                    window.lucide.createIcons(); 
                }
            }, [name]);
            return e('i', { 'data-lucide': name, className: className || "" });
        };

        // Data projektů
        const projectsData = [
            {
                id: 1,
                title: "Robotika a IoT v praxi",
                garant: "Ing. Jan Novák",
                location: "Učebna IVT (U12)",
                capacity: "15 / 15",
                isFull: true,
                tags: ["Technologie", "Programování"],
                description: "Sestav si vlastní meteostanici, naprogramuj ji v C++ a propoj ji s cloudem. Vyzkoušíš si základy mikrokontrolérů ESP32 a zapojování senzorů.",
                difficulty: "Střední",
                cost: "150 Kč"
            },
            {
                id: 2,
                title: "Filmová tvorba: Od scénáře k premiéře",
                garant: "Mgr. Marie Černá",
                location: "Auly a exteriéry",
                capacity: "12 / 20",
                isFull: false,
                tags: ["Umění", "Media"],
                description: "Intenzivní workshop, kde během tří dnů natočíte krátký hraný film nebo reportáž. Naučíte se základy kamery, střihu v DaVinci Resolve a práce se zvukem.",
                difficulty: "Nízká",
                cost: "Zdarma"
            },
            {
                id: 3,
                title: "Bioinformatika: Kód života",
                garant: "RNDr. Petr Svoboda, Ph.D.",
                location: "Laboratoř biologie",
                capacity: "8 / 12",
                isFull: false,
                tags: ["Věda", "Biologie"],
                description: "Jak se sekvenuje lidský genom a jak pomocí Pythonu hledáme mutace způsobující nemoci? Spojení moderní genetiky a pokročilé datové analýzy.",
                difficulty: "Vysoká",
                cost: "Zdarma"
            },
            {
                id: 4,
                title: "Architektura a urbanismus Slaného",
                garant: "MgA. Aleš Dvořák",
                location: "Ateliér výtvarné výchovy",
                capacity: "18 / 18",
                isFull: true,
                tags: ["Historie", "Design"],
                description: "Analýza veřejného prostoru kolem nás. Navrhni urbanistické vylepšení vybraného náměstí ve Slaném a vytvoř jeho fyzický 3D model z kartonu.",
                difficulty: "Střední",
                cost: "50 Kč"
            }
        ];

        const App = () => {
            const [search, setSearch] = React.useState("");
            const [selectedTag, setSelectedTag] = React.useState("Vše");
            const [showFull, setShowFull] = React.useState(true);
            const [isModalOpen, setIsModalOpen] = React.useState(false);

            const filteredProjects = projectsData.filter(project => {
                const matchesSearch = project.title.toLowerCase().indexOf(search.toLowerCase()) !== -1 || 
                                     project.description.toLowerCase().indexOf(search.toLowerCase()) !== -1;
                const matchesTag = selectedTag === "Vše" || project.tags.indexOf(selectedTag) !== -1;
                const matchesFull = showFull ? true : !project.isFull;
                return matchesSearch && matchesTag && matchesFull;
            });

            const tagsList = ["Vše", "Technologie", "Programování", "Umění", "Media", "Věda", "Biologie", "Historie", "Design"];

            return e('div', { className: 'p-4 md:p-8 max-w-7xl mx-auto' },
                // Hlavička
                e('header', { className: 'mb-12' },
                    e('div', { className: 'inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-teal-100 text-brand-dark mb-4 text-xs font-bold uppercase tracking-wider' },
                        e(Icon, { name: 'graduation-cap', className: 'w-4 h-4' }),
                        e('span', null, 'Gymnázium Slaný')
                    ),
                    e('h1', { className: 'text-4xl md:text-6xl font-black tracking-tight mb-4 text-slate-900' }, 'Projektové Dny 2026'),
                    e('p', { className: 'text-lg text-slate-500 max-w-2xl font-medium' }, 'Přehled volitelných modulů a tvůrčích dílen. Vyberte si svůj projekt a včas se registrujte.')
                ),

                // Filtry
                e('div', { className: 'bg-white p-6 rounded-3xl shadow-sm border border-teal-100 mb-8 flex flex-col gap-6' },
                    e('div', { className: 'flex flex-col md:flex-row justify-between items-start md:items-center gap-4' },
                        e('div', { className: 'relative w-full md:w-96' },
                            e('input', {
                                type: 'text',
                                placeholder: 'Hledat projekt...',
                                value: search,
                                onChange: (e) => setSearch(e.target.value),
                                className: 'w-full pl-4 pr-4 py-3 bg-slate-50 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-medium text-sm'
                            })
                        ),
                        e('label', { className: 'flex items-center gap-3 cursor-pointer select-none' },
                            e('input', {
                                type: 'checkbox',
                                checked: showFull,
                                onChange: () => setShowFull(!showFull),
                                className: 'w-4 h-4 text-brand-medium'
                            }),
                            e('span', { className: 'text-sm font-bold text-slate-600' }, 'Zobrazovat i plně obsazené projekty')
                        )
                    ),
                    e('div', { className: 'flex flex-wrap gap-2 border-t border-slate-100 pt-4' },
                        tagsList.map(tag => 
                            e('button', {
                                key: tag,
                                onClick: () => setSelectedTag(tag),
                                className: `px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider transition-all ${
                                    selectedTag === tag ? 'bg-brand-medium text-white shadow-md' : 'bg-slate-50 hover:bg-slate-100 text-slate-600'
                                }`
                            }, tag)
                        )
                    )
                ),

                // Mřížka karet
                e('div', { className: 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6' },
                    filteredProjects.map(project => 
                        e('div', {
                            key: project.id,
                            className: `bg-white rounded-3xl p-6 border flex flex-col justify-between ${
                                project.isFull ? 'border-slate-200 opacity-75' : 'border-teal-100 shadow-sm'
                            }`
                        },
                            e('div', null,
                                e('div', { className: 'flex justify-between items-start gap-4 mb-4' },
                                    e('div', { className: 'flex flex-wrap gap-1.5' },
                                        project.tags.map(t => e('span', { key: t, className: 'px-2 py-0.5 rounded bg-teal-50 text-[10px] font-bold uppercase tracking-wider text-brand-dark' }, t))
                                    ),
                                    e('span', { className: `px-2.5 py-1 rounded-full text-[11px] font-black tracking-wide uppercase ${project.isFull ? 'bg-red-50 text-red-600' : 'bg-emerald-50 text-emerald-600'}` }, project.isFull ? "Plno" : "Volno")
                                ),
                                e('h3', { className: 'text-xl font-extrabold mb-2 text-slate-900' }, project.title),
                                e('p', { className: 'text-xs font-bold text-slate-400 mb-4' }, `Garant: ${project.garant}`),
                                e('p', { className: 'text-sm text-slate-600 mb-6 leading-relaxed' }, project.description)
                            ),
                            e('div', { className: 'border-t border-slate-50 pt-4 mt-auto' },
                                e('div', { className: 'grid grid-cols-2 gap-y-3 gap-x-2 text-xs font-bold text-slate-500 mb-4' },
                                    e('div', null, `Místo: ${project.location}`),
                                    e('div', { className: 'text-right' }, `Náročnost: ${project.difficulty}`),
                                    e('div', null, `Cena: ${project.cost}`),
                                    e('div', { className: 'text-right' }, 'Kapacita: ', e('span', { className: project.isFull ? "text-red-500" : "text-emerald-500" }, project.capacity))
                                ),
                                e('button', {
                                    disabled: project.isFull,
                                    onClick: () => setIsModalOpen(true),
                                    className: `w-full py-2.5 rounded-xl text-xs font-black uppercase tracking-widest ${
                                        project.isFull ? 'bg-slate-100 text-slate-400 cursor-not-allowed' : 'bg-slate-900 hover:bg-brand-medium text-white'
                                    }`
                                }, project.isFull ? "Obsazeno" : "Přihlásit se")
                            )
                        )
                    )
                ),

                // Modal
                isModalOpen && e('div', { className: 'fixed inset-0 bg-slate-950/50 backdrop-blur-sm flex items-center justify-center p-4', style: { zIndex: 100 } },
                    e('div', { className: 'bg-white rounded-3xl p-6 max-w-md w-full border border-teal-100 shadow-2xl' },
                        e('div', { className: 'text-center mb-6' },
                            e('h3', { className: 'text-xl font-black mb-2 text-slate-900' }, 'Externí registrace'),
                            e('p', { className: 'text-sm text-slate-500 font-medium' }, 'Samotné odesílání přihlášek probíhá prostřednictvím školního informačního systému (Bakaláři / Škola Online).')
                        ),
                        e('button', {
                            onClick: () => setIsModalOpen(false),
                            className: 'w-full bg-brand-medium text-white font-black uppercase text-xs tracking-widest py-3 rounded-xl shadow-lg'
                        }, 'Rozumím, zavřít')
                    )
                )
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(e(App));
    </script>
</body>
</html>
