<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Projektových Dnů 2026 | Gymnázium Slaný</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'media', /* Automaticky přepíná tmavý režim podle systému/času uživatele */
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#0f766e',    /* Tmavě tyrkysová (Deep Teal) */
                            medium: '#0d9488',  /* Střední tyrkysová (Teal) */
                            light: '#2dd4bf',   /* Světlá tyrkysová (Turquoise) */
                            cyan: '#06b6d4',    /* Azurová (Cyan) */
                            yellow: '#facc15',  /* Zářivě žlutá (Yellow Accent) */
                            yellowHover: '#eab308',
                            bg: '#f0fdfa'       /* Velmi lehký tyrkysový nádech na pozadí */
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Plynulé přechody pro interaktivní prvky */
        .transition-smooth {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* Animace pro načtení modálu */
        @keyframes scaleIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .animate-scale-in {
            animation: scaleIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="bg-teal-50/30 dark:bg-slate-900 text-slate-900 dark:text-slate-100 pb-20 transition-colors duration-300">
    <div id="root"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.11/babel.min.js" crossorigin></script>
    <script src="https://unpkg.com/lucide@0.379.0/dist/umd/lucide.min.js"></script>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        // Pomocný komponent pro zobrazení moderních Lucide ikon
        const Icon = ({ name, className }) => {
            useEffect(() => { 
                if (window.lucide) window.lucide.createIcons(); 
            }, [name, className]);
            return <i data-lucide={name} className={className}></i>;
        };

        // ⬇️ SEM VLOŽTE SVÁ KOMPLETNÍ DATA PROJEKTŮ ⬇️
        const PROJECTS_DATA = [
            {
                "id": "atletika-kamaradka",
                "title": "Atletika je kamarádka",
                "years": ["NG", "VG"],
                "days": ["ST"],
                "leaderType": "učitel",
                "capacity": "20 studentů",
                "location": "Atletický stadion",
                "target": "Projekt je vhodný pro zkušené sportovce i pro ty, kteří si chtějí atletiku jen nezávazně vyzkoušet.",
                "warning": "S sebou sportovní outdoorové oblečení a vhodnou obuv na běhání.",
                "annotation": "Chceš si otestovat svou fyzičku, zlepšit techniku a zažít super sportovní dopoledne? Přijď na atletický stadion! Vyzkoušíme si královské disciplíny – od rychlých běhů, přes skoky až po vrhy."
            }
            // ... (zde doplňte zbytek svých dat)
        ];

        // Adresa na Google Formulář
        const formUrl = "https://docs.google.com/forms/d/e/1FAIpQLSfD_XbCj6X_Vp0hGvHkXN5W_0H_R9HwSg/viewform";

        const App = () => {
            const [selectedProject, setSelectedProject] = useState(null);
            const [filters, setFilters] = useState({ year: 'ALL', day: 'ALL', leaderType: 'ALL', search: '' });

            // Resetování filtrů
            const handleResetFilters = () => {
                setFilters({ year: 'ALL', day: 'ALL', leaderType: 'ALL', search: '' });
            };

            // Filtrace projektů
            const filteredProjects = useMemo(() => {
                return PROJECTS_DATA.filter(project => {
                    const matchYear = filters.year === 'ALL' || project.years.includes(filters.year);
                    const matchDay = filters.day === 'ALL' || project.days.includes(filters.day);
                    const matchLeader = filters.leaderType === 'ALL' || project.leaderType === filters.leaderType;
                    
                    const searchLower = filters.search.toLowerCase();
                    const matchSearch = !filters.search || 
                        project.title.toLowerCase().includes(searchLower) ||
                        (project.annotation && project.annotation.toLowerCase().includes(searchLower)) ||
                        (project.location && project.location.toLowerCase().includes(searchLower));

                    return matchYear && matchDay && matchLeader && matchSearch;
                });
            }, [filters]);

            return (
                <div className="min-h-screen font-sans selection:bg-brand-light/30 selection:text-brand-dark">
                    
                    {/* Hlavní Header */}
                    <header className="relative overflow-hidden bg-gradient-to-b from-teal-900 via-teal-950 to-slate-900 text-white pt-20 pb-24 px-4 border-b border-teal-500/10">
                        <div className="absolute inset-0 bg-[radial-gradient(circle_at_top_right,rgba(45,212,191,0.12),transparent_45%)]"></div>
                        <div className="absolute -bottom-24 left-1/2 -translate-x-1/2 w-full max-w-7xl h-48 bg-teal-500/5 blur-[100px] rounded-full"></div>
                        
                        <div className="max-w-6xl mx-auto text-center relative z-10">
                            <div className="inline-flex items-center gap-2.5 bg-teal-500/10 text-brand-light px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-widest mb-6 border border-teal-500/20 backdrop-blur-sm">
                                <Icon name="calendar" className="w-3.5 h-3.5" />
                                Gymnázium Slaný • Červen 2026
                            </div>
                            <h1 className="text-4xl md:text-6xl font-black tracking-tight mb-4 bg-gradient-to-r from-white via-slate-100 to-teal-200 bg-clip-text text-transparent leading-none">
                                Katalog Projektových Dnů
                            </h1>
                            <p className="text-slate-400 max-w-xl mx-auto text-sm md:text-base font-medium leading-relaxed">
                                Vyberte si své projekty na středu a čtvrtek. Filtrujte podle dnů, ročníků nebo zaměření.
                            </p>
                        </div>
                    </header>

                    {/* Hlavní obsah a filtry */}
                    <main className="max-w-6xl mx-auto px-4 -mt-10 relative z-20">
                        <div className="bg-white dark:bg-slate-800/90 rounded-2xl md:rounded-3xl shadow-xl border border-teal-100/50 dark:border-slate-700/50 p-4 md:p-6 backdrop-blur-md mb-8">
                            
                            {/* Vyhledávací pole */}
                            <div className="relative mb-5">
                                <Icon name="search" className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500 w-5 h-5" />
                                <input 
                                    type="text" 
                                    placeholder="Hledat projekt podle názvu, anotace nebo místa..."
                                    value={filters.search}
                                    onChange={(e) => setFilters(prev => ({ ...prev, search: e.target.value }))}
                                    className="w-full bg-slate-50 dark:bg-slate-900/50 text-slate-900 dark:text-slate-100 pl-12 pr-4 py-4 rounded-xl md:rounded-2xl border border-slate-200/60 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-medium/50 focus:border-brand-medium text-sm transition-smooth font-medium shadow-inner placeholder:text-slate-400 dark:placeholder:text-slate-600"
                                />
                            </div>

                            {/* Tlačítka filtrů */}
                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                {/* Filtr: Ročník */}
                                <div>
                                    <label className="block text-[11px] font-black uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-1.5 ml-1">Cílová skupina</label>
                                    <div className="flex bg-slate-50 dark:bg-slate-900/50 p-1 rounded-xl border border-slate-200/60 dark:border-slate-700">
                                        {['ALL', 'NG', 'VG'].map(type => (
                                            <button 
                                                key={type}
                                                onClick={() => setFilters(prev => ({ ...prev, year: type }))}
                                                className={`flex-1 text-center py-2 text-xs font-bold rounded-lg transition-smooth ${filters.year === type ? 'bg-white dark:bg-slate-700 text-brand-dark dark:text-brand-light shadow-md border border-teal-100/50 dark:border-slate-600' : 'text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200'}`}
                                            >
                                                {type === 'ALL' ? 'Všechny' : type === 'NG' ? 'Nižší gym.' : 'Vyšší gym.'}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* Filtr: Den */}
                                <div>
                                    <label className="block text-[11px] font-black uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-1.5 ml-1">Projektový den</label>
                                    <div className="flex bg-slate-50 dark:bg-slate-900/50 p-1 rounded-xl border border-slate-200/60 dark:border-slate-700">
                                        {['ALL', 'ST', 'ČT'].map(day => (
                                            <button 
                                                key={day}
                                                onClick={() => setFilters(prev => ({ ...prev, day: day }))}
                                                className={`flex-1 text-center py-2 text-xs font-bold rounded-lg transition-smooth ${filters.day === day ? 'bg-white dark:bg-slate-700 text-brand-dark dark:text-brand-light shadow-md border border-teal-100/50 dark:border-slate-600' : 'text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200'}`}
                                            >
                                                {day === 'ALL' ? 'Oba dny' : day === 'ST' ? 'Středa' : 'Čtvrtek'}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* Filtr: Vedení */}
                                <div>
                                    <label className="block text-[11px] font-black uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-1.5 ml-1">Kdo projekt vede</label>
                                    <div className="flex bg-slate-50 dark:bg-slate-900/50 p-1 rounded-xl border border-slate-200/60 dark:border-slate-700">
                                        {['ALL', 'učitel', 'studentský', 'host z praxe'].map(leader => (
                                            <button 
                                                key={leader}
                                                onClick={() => setFilters(prev => ({ ...prev, leaderType: leader }))}
                                                className={`flex-1 text-center py-2 text-[11px] font-bold rounded-lg transition-smooth truncate px-1 ${filters.leaderType === leader ? 'bg-white dark:bg-slate-700 text-brand-dark dark:text-brand-light shadow-md border border-teal-100/50 dark:border-slate-600' : 'text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200'}`}
                                            >
                                                {leader === 'ALL' ? 'Všichni' : leader === 'učitel' ? 'Učitel' : leader === 'studentský' ? 'Student' : 'Host'}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Statistiky nalezených projektů */}
                        <div className="flex justify-between items-center px-2 mb-6">
                            <p className="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500">
                                Nalezeno: <span className="text-brand-medium font-black">{filteredProjects.length}</span> {filteredProjects.length === 1 ? 'projekt' : filteredProjects.length > 1 && filteredProjects.length < 5 ? 'projekty' : 'projektů'}
                            </p>
                            {(filters.year !== 'ALL' || filters.day !== 'ALL' || filters.leaderType !== 'ALL' || filters.search) && (
                                <button onClick={handleResetFilters} className="text-xs font-black uppercase tracking-wider text-rose-500 hover:text-rose-600 flex items-center gap-1 transition-smooth">
                                    <Icon name="x" className="w-3.5 h-3.5" /> Vymazat filtry
                                </button>
                            )}
                        </div>

                        {/* Mřížka projektů */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            {filteredProjects.map(project => (
                                <div 
                                    key={project.id}
                                    onClick={() => setSelectedProject(project)}
                                    className="bg-white dark:bg-slate-800 rounded-2xl md:rounded-3xl border border-teal-100/60 dark:border-slate-700/60 shadow-sm hover:shadow-xl hover:border-brand-medium/30 dark:hover:border-brand-medium/30 transition-all duration-300 p-5 md:p-6 flex flex-col justify-between cursor-pointer group relative overflow-hidden"
                                >
                                    <div>
                                        {/* Tagy */}
                                        <div className="flex flex-wrap items-center gap-2 mb-4">
                                            {project.days.map(d => (
                                                <span key={d} className="bg-brand-medium/10 text-brand-dark dark:text-brand-light px-2.5 py-1 rounded-lg text-[10px] font-black uppercase tracking-wider">
                                                    {d === 'ST' ? 'Středa' : 'Čtvrtek'}
                                                </span>
                                            ))}
                                            {project.years.map(y => (
                                                <span key={y} className="bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 px-2.5 py-1 rounded-lg text-[10px] font-black uppercase tracking-wider">
                                                    {y}
                                                </span>
                                            ))}
                                            <span className={`px-2.5 py-1 rounded-lg text-[10px] font-black uppercase tracking-wider ml-auto ${
                                                project.leaderType === 'učitel' ? 'bg-blue-50 dark:bg-blue-950/40 text-blue-600' :
                                                project.leaderType === 'studentský' ? 'bg-purple-50 dark:bg-purple-950/40 text-purple-600' : 'bg-amber-50 dark:bg-amber-950/40 text-amber-600'
                                            }`}>
                                                {project.leaderType}
                                            </span>
                                        </div>

                                        {/* Nadpis */}
                                        <h3 className="text-xl font-bold text-slate-900 dark:text-white group-hover:text-brand-medium transition-smooth leading-snug mb-3">
                                            {project.title}
                                        </h3>

                                        {/* Krátká anotace */}
                                        <p className="text-slate-500 dark:text-slate-400 text-sm font-medium line-clamp-3 leading-relaxed mb-6">
                                            {project.annotation}
                                        </p>
                                    </div>

                                    {/* Spodní info řádek */}
                                    <div className="flex items-center justify-between pt-4 border-t border-slate-100 dark:border-slate-700 text-xs font-semibold text-slate-400 dark:text-slate-500">
                                        <div className="flex items-center gap-1.5 truncate max-w-[70%]">
                                            <Icon name="map-pin" className="w-3.5 h-3.5 flex-shrink-0 text-slate-400" />
                                            <span className="truncate">{project.location || 'Budova školy'}</span>
                                        </div>
                                        <span className="text-brand-medium dark:text-brand-light font-black uppercase text-[10px] tracking-widest flex items-center gap-1 flex-shrink-0">
                                            Detail <Icon name="arrow-right" className="w-3 h-3 group-hover:translate-x-1 transition-smooth" />
                                        </span>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </main>

                    {/* Detail projektu v Modálním okně */}
                    {selectedProject && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                            <div className="absolute inset-0 bg-slate-950/60 backdrop-blur-sm transition-opacity" onClick={() => setSelectedProject(null)}></div>
                            
                            <div className="bg-white dark:bg-slate-800 rounded-2xl md:rounded-3xl shadow-2xl border border-teal-100/50 dark:border-slate-700 max-w-2xl w-full max-h-[90vh] flex flex-col overflow-hidden relative z-10 animate-scale-in">
                                
                                {/* Header modálu */}
                                <div className="p-6 border-b border-slate-100 dark:border-slate-700 flex justify-between items-start gap-4">
                                    <div>
                                        <div className="flex flex-wrap gap-2 mb-2">
                                            {selectedProject.days.map(d => (
                                                <span key={d} className="bg-brand-medium/10 text-brand-dark dark:text-brand-light px-2.5 py-1 rounded-lg text-[10px] font-black uppercase tracking-wider">
                                                    {d === 'ST' ? 'Středa' : 'Čtvrtek'}
                                                </span>
                                            ))}
                                            {selectedProject.years.map(y => (
                                                <span key={y} className="bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 px-2.5 py-1 rounded-lg text-[10px] font-black uppercase tracking-wider">
                                                    {y}
                                                </span>
                                            ))}
                                        </div>
                                        <h2 className="text-2xl font-black text-slate-900 dark:text-white leading-tight">{selectedProject.title}</h2>
                                    </div>
                                    <button onClick={() => setSelectedProject(null)} className="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1.5 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl transition-smooth">
                                        <Icon name="x" className="w-6 h-6" />
                                    </button>
                                </div>

                                {/* Obsah modálu */}
                                <div className="p-6 overflow-y-auto space-y-6 scrollbar-hide">
                                    
                                    {/* Mřížka parametrů */}
                                    <div className="grid grid-cols-2 gap-4 bg-slate-50 dark:bg-slate-900/50 p-4 rounded-xl md:rounded-2xl border border-slate-100 dark:border-slate-700/60">
                                        <div className="flex gap-2.5">
                                            <div className="w-8 h-8 rounded-lg bg-teal-500/10 text-brand-medium dark:text-brand-light flex items-center justify-center flex-shrink-0"><Icon name="users" className="w-4 h-4" /></div>
                                            <div>
                                                <span className="block text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-wider">Kapacita</span>
                                                <span className="text-sm font-bold text-slate-700 dark:text-slate-300">{selectedProject.capacity || 'Nespecifikováno'}</span>
                                            </div>
                                        </div>
                                        <div className="flex gap-2.5">
                                            <div className="w-8 h-8 rounded-lg bg-teal-500/10 text-brand-medium dark:text-brand-light flex items-center justify-center flex-shrink-0"><Icon name="map-pin" className="w-4 h-4" /></div>
                                            <div className="truncate">
                                                <span className="block text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-wider">Místo konání</span>
                                                <span className="text-sm font-bold text-slate-700 dark:text-slate-300 truncate block">{selectedProject.location || 'Budova školy'}</span>
                                            </div>
                                        </div>
                                        <div className="flex gap-2.5 col-span-2 pt-2 border-t border-slate-200/50 dark:border-slate-700/50">
                                            <div className="w-8 h-8 rounded-lg bg-teal-500/10 text-brand-medium dark:text-brand-light flex items-center justify-center flex-shrink-0"><Icon name="user" className="w-4 h-4" /></div>
                                            <div>
                                                <span className="block text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-wider">Typ vedení projektu</span>
                                                <span className="text-sm font-bold text-slate-700 dark:text-slate-300 uppercase text-[11px] tracking-wide">{selectedProject.leaderType}</span>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Anotace */}
                                    <div>
                                        <h4 className="text-[11px] font-black uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-2">Anotace projektu</h4>
                                        <p className="text-slate-600 dark:text-slate-300 text-sm font-medium leading-relaxed bg-slate-50/50 dark:bg-slate-900/20 p-4 rounded-xl border border-slate-100/50 dark:border-slate-800">{selectedProject.annotation}</p>
                                    </div>

                                    {/* Pro koho je určen */}
                                    {selectedProject.target && (
                                        <div className="flex gap-3 bg-blue-50/50 dark:bg-blue-950/20 border border-blue-100 dark:border-blue-900/50 p-4 rounded-xl">
                                            <Icon name="info" className="w-5 h-5 text-blue-500 flex-shrink-0 mt-0.5" />
                                            <div>
                                                <h4 className="text-xs font-black uppercase tracking-wider text-blue-600 dark:text-blue-400 mb-0.5">Pro koho je projekt vhodný</h4>
                                                <p className="text-slate-600 dark:text-slate-300 text-sm font-medium leading-relaxed">{selectedProject.target}</p>
                                            </div>
                                        </div>
                                    )}

                                    {/* Důležitá upozornění */}
                                    {selectedProject.warning && (
                                        <div className="flex gap-3 bg-amber-50/50 dark:bg-amber-950/20 border border-amber-100 dark:border-amber-900/50 p-4 rounded-xl">
                                            <Icon name="alert-triangle" className="w-5 h-5 text-amber-500 flex-shrink-0 mt-0.5" />
                                            <div>
                                                <h4 className="text-xs font-black uppercase tracking-wider text-amber-600 dark:text-amber-400 mb-0.5">Důležité informace a výbava</h4>
                                                <p className="text-slate-600 dark:text-slate-300 text-sm font-medium leading-relaxed">{selectedProject.warning}</p>
                                            </div>
                                        </div>
                                    )}
                                </div>

                                {/* Patička modálu */}
                                <div className="bg-slate-50 dark:bg-slate-900/40 p-4 flex justify-center items-center border-t border-slate-100 dark:border-slate-700">
                                    <button onClick={() => setSelectedProject(null)} className="w-full sm:w-auto bg-slate-200 hover:bg-slate-300 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 px-8 py-3 rounded-xl font-black uppercase text-xs transition-smooth tracking-widest">
                                        Zavřít detail
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Plovoucí tlačítko "Chci se přihlásit" – otevírá formulář na kliknutí */}
                    <div className="fixed bottom-8 right-8 z-40">
                        <a 
                            href={formUrl}
                            target="_blank"
                            rel="noopener noreferrer"
                            className="bg-brand-yellow hover:bg-brand-yellowHover text-teal-950 px-6 py-3.5 rounded-full shadow-2xl transition-smooth flex items-center justify-center gap-2 group border border-teal-400/20 dark:border-yellow-500/30"
                        >
                            <Icon name="pen-tool" className="w-5 h-5" />
                            <span className="font-black uppercase text-xs tracking-widest">Chci se přihlásit</span>
                        </a>
                    </div>

                    {/* Patička */}
                    <footer className="max-w-6xl mx-auto px-4 py-12 border-t border-teal-100 dark:border-slate-800 text-center mt-12">
                        <p className="text-slate-400 dark:text-slate-500 text-xs font-black uppercase tracking-[0.3em] mb-2">Gymnázium Slaný • Projektové dny 2026</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
