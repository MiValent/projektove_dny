            switch (type ? type.toLowerCase() : '') {
                case 'učitel':
                    return 'bg-blue-50 text-blue-700 border-blue-200 dark:bg-blue-950/40 dark:text-blue-300 dark:border-blue-800/50';
                case 'studentský':
                    return 'bg-purple-50 text-purple-700 border-purple-200 dark:bg-purple-950/40 dark:text-purple-300 dark:border-purple-800/50';
                case 'host z praxe':
                    return 'bg-amber-50 text-amber-700 border-amber-200 dark:bg-amber-950/40 dark:text-amber-300 dark:border-amber-800/50';
                default:
                    return 'bg-slate-50 text-slate-700 border-slate-200 dark:bg-slate-800/50 dark:text-slate-300 dark:border-slate-700';
            }
        };

        const getDayBadgeColor = (day) => {
            switch (day ? day.toUpperCase() : '') {
                case 'ST':
                    return 'bg-emerald-50 text-emerald-700 border-emerald-200 dark:bg-emerald-950/40 dark:text-emerald-300 dark:border-emerald-800/50';
                case 'ČT':
                    return 'bg-rose-50 text-rose-700 border-rose-200 dark:bg-rose-950/40 dark:text-rose-300 dark:border-rose-800/50';
                default:
                    return 'bg-slate-50 text-slate-700 border-slate-200 dark:bg-slate-800/50 dark:text-slate-300 dark:border-slate-700';
            }
        };

                    window.lucide.createIcons();
                }

            const filteredProjects = React.useMemo(() => {
                return PROJECTS_DATA.filter(p => {
                    const matchesSearch = p.title.toLowerCase().includes(search.toLowerCase()) || 
                                          p.annotation.toLowerCase().includes(search.toLowerCase());
                    const matchesYear = selectedYear === "ALL" || p.years.includes(selectedYear);
                    const matchesDay = selectedDay === "ALL" || p.days.includes(selectedDay);
                    const matchesLeader = selectedLeader === "ALL" || p.leaderType === selectedLeader;
                    return matchesSearch && matchesYear && matchesDay && matchesLeader;
                });
            }, [search, selectedYear, selectedDay, selectedLeader]);

                const openTime = new Date('2026-06-18T14:00:00');
                if (new Date() < openTime) {

                } else {
                    window.open("https://forms.google.com", "_blank");
                }
            };

                                            <p className="text-slate-600 dark:text-slate-300 bg-slate-50/50 dark:bg-slate-900/20 p-3 rounded-xl border border-slate-100/50 dark:border-slate-800/30">{selectedProject.annotation}</p>

                                            <h4 className="font-bold text-xs uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-1.5">Pro koho je projekt určen</h4>

                                                <div>
                                                    <h5 className="font-bold text-xs uppercase tracking-wider mb-0.5">Důležité informace a požadavky</h5>
                                                    <p className="text-sm font-medium leading-normal">{selectedProject.warning}</p>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>

                                <div className="p-6 border-t border-slate-100 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-900/30 flex items-center justify-end gap-3">
                                    <button onClick={() => setSelectedProject(null)} className="px-5 py-3 text-sm font-bold text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 transition-colors">
                                        Zavřít detail
                                    </button>
                                    <button onClick={handleApply} className="bg-brand-medium hover:bg-brand-dark dark:bg-teal-600 dark:hover:bg-teal-500 text-white px-6 py-3 rounded-xl text-sm font-black uppercase tracking-wider shadow-md hover:shadow-lg transition-smooth">
                                        Přihlásit se na projekt
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="fixed bottom-8 right-8 z-40">
                        <button 
                            onClick={handleApply}
                            className="bg-brand-yellow hover:bg-brand-yellowHover text-teal-950 px-6 py-3.5 rounded-full shadow-2xl transition-smooth flex items-center justify-center gap-2 group border border-teal-400/20 dark:border-yellow-500/30"
                        >
                            <span data-lucide="pen-tool" className="w-5 h-5"></span>
                            <span className="font-black uppercase text-xs tracking-widest">Chci se přihlásit</span>
                        </button>
                    </div>

                    <footer className="max-w-6xl mx-auto px-4 py-12 border-t border-teal-100 dark:border-slate-800 text-center mt-12">
                        <p className="text-slate-400 dark:text-slate-500 text-xs font-black uppercase tracking-[0.3em] mb-2">Gymnázium Slaný • Projektové dny 2026</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
