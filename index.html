                            <div className="relative w-full md:w-80">
                                <span className="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-teal-600/60">
                                    <Icon name="search" className="w-4 h-4" />
                                </span>
                                <input 
                                    className="w-full pl-10 pr-4 py-2.5 bg-teal-50/20 text-slate-800 placeholder-slate-400 rounded-xl outline-none focus:ring-2 focus:ring-brand-medium border border-teal-100 font-medium text-sm transition-smooth tracking-wide"
                                    placeholder="Hledat projekt..."
                                    value={searchQuery}
                                    onChange={e => setSearchQuery(e.target.value)}
                                />
                            </div>

                            {/* Filtry třídy a dne konání */}
                            <div className="flex flex-col sm:flex-row gap-3 w-full md:w-auto justify-end">
                                {/* Filtr: Třída */}
                                <div className="flex flex-col w-full sm:w-[170px]">
                                    <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Cílová skupina / Třída</label>
                                    <select 
                                        className="w-full px-3 py-2.5 bg-teal-50/10 text-slate-700 border border-teal-100 rounded-xl font-bold text-xs uppercase tracking-wider focus:ring-2 focus:ring-brand-medium outline-none cursor-pointer transition-smooth"
                                        value={yearFilter}
                                        onChange={e => setYearFilter(e.target.value)}
                                    >
                                        <option value="all">Třídy: Všechny</option>
                                        <option value="NG">Jen nižší gym. [NG]</option>
                                        <option value="VG">Jen vyšší gym. [VG]</option>
                                    </select>
                                </div>

                                {/* Filtr: Den */}
                                <div className="flex flex-col w-full sm:w-[170px]">
                                    <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Den konání</label>
                                    <select 
                                        className="w-full px-3 py-2.5 bg-teal-50/10 text-slate-700 border border-teal-100 rounded-xl font-bold text-xs uppercase tracking-wider focus:ring-2 focus:ring-brand-medium outline-none cursor-pointer transition-smooth"
                                        value={dayFilter}
                                        onChange={e => setDayFilter(e.target.value)}
                                    >
                                        <option value="all">Dny: Všechny</option>
                                        <option value="ST">Středa [ST]</option>
                                        <option value="ČT">Čtvrtek [ČT]</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        {/* Seznam a mřížka s kartami projektů */}
                        {filteredProjects.length === 0 ? (
                            <div className="bg-white rounded-3xl p-16 text-center shadow-sm border border-teal-100 max-w-md mx-auto my-12">
                                <div className="bg-teal-50 text-brand-medium w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                                    <Icon name="search" className="w-8 h-8" />
                                </div>
                                <h3 className="text-xl font-bold text-slate-800 mb-1 tracking-wider">Žádné projekty nenalezeny</h3>
                                <p className="text-slate-500 text-sm tracking-wide">Zkuste upravit vyhledávání nebo změnit nastavené filtry.</p>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {filteredProjects.map(p => (
                                    <div 
                                        key={p.id} 
                                        onClick={() => setSelectedProject(p)}
                                        className="bg-white p-6 rounded-2xl border border-teal-100/60 shadow-sm hover:shadow-xl hover:scale-[1.01] hover:border-brand-medium/40 transition-smooth cursor-pointer flex flex-col justify-between group relative overflow-hidden text-left"
                                    >
                                        {/* Levá tyrkysová linka */}
                                        <div className="absolute top-0 left-0 bottom-0 w-1.5 bg-brand-medium"></div>

                                        <div>
                                            <div className="flex justify-between items-start mb-3 pl-1 flex-wrap gap-2">
                                                {/* Dny konání */}
                                                <div className="flex gap-1 items-center flex-wrap">
                                                    {p.days.map(d => (
                                                        <span key={d} className={`text-[10px] px-2 py-0.5 rounded-md border ${getDayTagStyle(d)}`}>
                                                            {d}
                                                        </span>
                                                    ))}
                                                </div>
                                                {/* Třídy / Ročník */}
                                                <div className="flex gap-1">
                                                    {p.years.map(y => (
                                                        <span key={y} className={`text-[10px] px-2 py-0.5 rounded-md border ${getYearTagStyle(y)}`}>
                                                            {y}
                                                        </span>
                                                    ))}
                                                </div>
                                            </div>

                                            {/* Druhý řádek tagů */}
                                            {(p.leaderType === "studentský" || p.leaderType === "expert") && (
                                                <div className="flex flex-wrap gap-1.5 pl-1 mb-3">
                                                    <span className={`text-[9px] px-2 py-0.5 rounded border uppercase tracking-wider ${getLeaderTypeTagStyle(p.leaderType)}`}>
                                                        {getLeaderTypeLabel(p.leaderType)}
                                                    </span>
                                                </div>
                                            )}

                                            <h3 className="font-extrabold text-lg text-slate-900 mb-3 leading-snug group-hover:text-brand-medium transition-colors pl-1 tracking-wide">
                                                {p.title}
                                            </h3>
                                            
                                            <p className="text-slate-500 text-sm line-clamp-3 leading-relaxed mb-4 pl-1 tracking-wide">
                                                {p.annotation}
                                            </p>
                                        </div>

                                        {/* Spodní kapacita na kartě */}
                                        <div className="mt-auto pt-4 border-t border-teal-50 flex items-center justify-end text-xs text-slate-400 pl-1">
                                            <span className="flex items-center gap-1 font-extrabold text-teal-800 bg-teal-50 px-2.5 py-1 rounded text-[10px] uppercase tracking-wider">
                                                <Icon name="users" className="w-3 h-3 text-brand-medium" /> {p.capacity}
                                            </span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>

                    {/* Detailní modální okno pro vybraný projekt */}
                    {selectedProject && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-teal-950/70 backdrop-blur-sm transition-smooth" onClick={() => setSelectedProject(null)}>
                            <div 
                                className="bg-white w-full max-w-2xl rounded-3xl overflow-hidden shadow-2xl relative animate-scale-in" 
                                onClick={e => e.stopPropagation()}
                            >
                                {/* Zavírací tlačítko */}
                                <button 
                                    onClick={() => setSelectedProject(null)} 
                                    className="absolute top-6 right-6 p-2 bg-teal-50 rounded-full hover:bg-teal-100 text-teal-800 hover:text-teal-950 transition-smooth"
                                >
                                    <Icon name="x" className="w-5 h-5" />
                                </button>
                                
                                <div className="p-6 md:p-10 text-left">
                                    {/* Horní badge a tagy v modálu */}
                                    <div className="flex flex-wrap items-center gap-2 mb-4">
                                        {selectedProject.days.map(d => (
                                            <span key={d} className={`text-xs px-2.5 py-1 rounded-full border ${getDayTagStyle(d)} tracking-wide`}>
                                                Den: {d === "ST" ? "Středa" : "Čtvrtek"} ({d})
                                            </span>
                                        ))}
                                        {(selectedProject.leaderType === "studentský" || selectedProject.leaderType === "expert") && (
                                            <span className={`text-xs px-2.5 py-1 rounded-full border uppercase tracking-wider ${getLeaderTypeTagStyle(selectedProject.leaderType)}`}>
                                                {getLeaderTypeLabel(selectedProject.leaderType)}
                                            </span>
                                        )}
                                    </div>
                                    
                                    {/* Titulek */}
                                    <h2 className="text-2xl md:text-3xl font-black leading-tight text-slate-900 mb-6 uppercase tracking-wider">
                                        {selectedProject.title}
                                    </h2>
                                    
                                    {/* Informační mřížka s parametry */}
                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 p-4 bg-teal-50/40 rounded-2xl mb-6 border border-teal-100/50">
                                        <div className="space-y-0.5">
                                            <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Kapacita</span>
                                            <span className="text-sm font-extrabold text-teal-950 block tracking-wide">{selectedProject.capacity}</span>
                                        </div>
                                        <div className="space-y-0.5">
                                            <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Určeno pro</span>
                                            <div className="flex gap-1 mt-0.5">
                                                {selectedProject.years.map(y => (
                                                    <span key={y} className={`text-[10px] px-1.5 py-0.2 rounded border ${getYearTagStyle(y)}`}>
                                                        {y}
                                                    </span>
                                                ))}
                                            </div>
                                        </div>
                                        <div className="space-y-0.5">
                                            <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Lokalita</span>
                                            <span className="text-sm font-extrabold text-teal-950 block truncate tracking-wide" title={selectedProject.location}>
                                                {selectedProject.location}
                                            </span>
                                        </div>
                                    </div>

                                    {/* Popisy */}
                                    <div className="space-y-5">
                                        <div>
                                            <h5 className="text-[10px] font-black uppercase text-brand-medium mb-1.5 tracking-widest flex items-center gap-1">
                                                <Icon name="align-left" className="w-3 h-3 text-brand-medium" /> Anotace projektu
                                            </h5>
                                            <p className="text-slate-600 leading-relaxed font-medium text-sm md:text-base tracking-wide">
                                                {selectedProject.annotation}
                                            </p>
                                        </div>
                                        
                                        <div>
                                            <h5 className="text-[10px] font-black uppercase text-slate-400 mb-1 tracking-widest">Pro koho je projekt ideální?</h5>
                                            <p className="text-sm font-semibold text-slate-700 tracking-wide">
                                                {selectedProject.target}
                                            </p>
                                        </div>

                                        {selectedProject.warning && (
                                            <div className="bg-yellow-50 p-4 rounded-2xl border border-yellow-200 text-left">
                                                <h5 className="text-[11px] font-black uppercase text-amber-600 mb-1 tracking-widest flex items-center gap-2">
                                                    <Icon name="alert-triangle" className="w-3.5 h-3.5 text-amber-500" /> Důležité upozornění
                                                </h5>
                                                <p className="text-xs italic text-amber-950 leading-relaxed tracking-wide">
                                                    {selectedProject.warning}
                                                </p>
                                            </div>
                                        )}
                                    </div>
                                </div>
                                
                                <div className="bg-teal-50/30 p-6 flex justify-end items-center border-t border-teal-50 gap-3">
                                    <button 
                                        onClick={() => setSelectedProject(null)} 
                                        className="bg-slate-200 text-slate-600 px-6 py-2.5 rounded-xl font-bold uppercase text-xs hover:bg-slate-300 transition-smooth tracking-wider"
                                    >
                                        Zavřít detail
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Automaticky přepínané vyskakovací okno na tlačítku */}
                    {showInfoModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-teal-950/75 backdrop-blur-sm transition-smooth" onClick={() => setShowInfoModal(false)}>
                            <div className="bg-white rounded-3xl p-8 max-w-md w-full text-center shadow-2xl relative animate-scale-in" onClick={e => e.stopPropagation()}>
                                
                                {new Date() < launchTime ? (
                                    /* FÁZE 1: PŘED SPUŠTĚNÍM */
                                    <>
                                        <div className="bg-yellow-100 text-yellow-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                                            <Icon name="clock" className="w-8 h-8" />
                                        </div>
                                        <h3 className="text-xl font-black uppercase text-teal-950 mb-3 tracking-wider">Spouštíme v neděli v 18:00</h3>
                                        <p className="text-slate-600 text-sm leading-relaxed mb-6 tracking-wide">
                                            Nyní probíhá pouze fáze čtení katalogu a klidného výběru. Zápis se otevře v neděli v 18:00, abychom zaručili, že nikdo nebude znevýhodněn kvůli pátečnímu nebo pondělnímu cestování.
                                        </p>
                                    </>
                                ) : new Date() >= closeTime ? (
                                    /* FÁZE 3: PO UZAVŘENÍ */
                                    <>
                                        <div className="bg-red-50 text-red-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                                            <Icon name="lock" className="w-8 h-8" />
                                        </div>
                                        <h3 className="text-xl font-black uppercase text-red-950 mb-2 tracking-wider">Přihlašování bylo ukončeno</h3>
                                        <p className="text-slate-600 text-sm leading-relaxed mb-4 tracking-wide">
                                            Termín pro odeslání přihlášek (čtvrtek 18. června v 8:00) již uplynul a data se zpracovávají.
                                        </p>
                                        <div className="bg-red-50 p-4 rounded-xl border border-red-100 text-left mb-6">
                                            <p className="text-xs font-black uppercase text-red-800 tracking-wide mb-1 flex items-center gap-1">
                                                ⚠️ Nestihl/a ses zapsat?
                                            </p>
                                            <p className="text-xs text-red-950 leading-relaxed font-medium">
                                                Jestli nejsi zapsaný/á, ozvi se co nejdřív na e-mail <strong className="select-all block mt-0.5 text-red-900">michaela.valentova@gymnaziumslany.cz</strong>
                                            </p>
                                        </div>
                                    </>
                                ) : (
                                    /* FÁZE 2: PRÁVĚ BĚŽÍ (ZÁCHRANNÁ PODMÍNKA) */
                                    <>
                                        <div className="bg-emerald-100 text-emerald-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                                            <Icon name="external-link" className="w-8 h-8" />
                                        </div>
                                        <h3 className="text-xl font-black uppercase text-emerald-950 mb-3 tracking-wider">Přihlašování běží</h3>
                                        <p className="text-slate-600 text-sm leading-relaxed mb-6 tracking-wide">
                                            Zápis na projektové dny je aktivní. Kliknutím na tlačítko níže otevřete přihlašovací Google formulář.
                                        </p>
                                    </>
                                )}

                                <button 
                                    onClick={() => {
                                        const currentTime = new Date();
                                        if (currentTime >= launchTime && currentTime < closeTime) {
                                            window.open(formUrl, '_blank');
                                        }
                                        setShowInfoModal(false);
                                    }}
                                    className="w-full bg-brand-medium hover:bg-brand-dark text-white font-bold py-3 px-6 rounded-2xl transition-smooth uppercase text-xs tracking-wider shadow-lg"
                                >
                                    {new Date() >= launchTime && new Date() < closeTime ? "Otevřít formulář" : "Rozumím, pokračovat"}
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Plovoucí tlačítko na přihlášení */}
                    <div className="fixed bottom-8 right-8 z-40">
                        <button 
                            onClick={handleApply}
                            className="bg-brand-yellow hover:bg-brand-yellowHover text-teal-950 px-6 py-3.5 rounded-full shadow-2xl transition-smooth flex items-center justify-center gap-2 group border border-teal-400/20"
                        >
                            <Icon name="pen-tool" className="w-5 h-5" />
                            <span className="font-black uppercase text-xs tracking-widest">Chci se přihlásit</span>
                        </button>
                    </div>

                    {/* Patička webu */}
                    <footer className="max-w-6xl mx-auto px-4 py-12 border-t border-teal-100 text-center mt-12">
                        <p className="text-slate-400 text-xs font-black uppercase tracking-[0.3em] mb-2">Gymnázium Slaný • Projektové dny 2026</p>
                        <p className="text-slate-400 text-[10px]">Navrženo pro rychlou, stabilní a estetickou organizaci přihlašování.</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
