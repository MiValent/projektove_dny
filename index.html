                                    p.years.map(y => e('span', { key: y, className: 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 text-[10px] font-black px-2 py-0.5 rounded uppercase tracking-wider' }, y))
                                ),
                                e('span', { className: 'text-[11px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider flex items-center gap-1' },
                                    e(Icon, { name: 'users', className: 'w-3 h-3' }), p.capacity
                                )
                            ),
                            e('h4', { className: 'font-extrabold text-lg mb-2 leading-snug text-slate-900 dark:text-slate-100 group-hover:text-brand-medium dark:group-hover:text-brand-light transition-colors text-left' }, p.title),
                            e('p', { className: 'text-xs font-semibold text-teal-700 dark:text-teal-400 mb-4 uppercase tracking-wider text-left flex items-center gap-1' }, 
                                e(Icon, { name: 'bookmark', className: 'w-3 h-3' }), p.leaderType
                            ),
                            e('p', { className: 'text-slate-500 dark:text-slate-400 text-sm line-clamp-3 mb-6 leading-relaxed text-left' }, p.annotation),
                            
                            e('div', { className: 'mt-auto pt-4 border-t border-slate-100 dark:border-slate-800/60 flex items-center justify-between text-brand-dark dark:text-brand-light text-[11px] font-black uppercase tracking-wider' },
                                e('span', null, 'Zobrazit detaily'),
                                e(Icon, { name: 'chevron-right', className: 'w-4 h-4 group-hover:translate-x-1 transition-transform' })
                            )
                        ))
                    )
                ),

                selectedProject && e('div', { className: 'fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-sm', onClick: () => setSelectedProject(null) },
                    e('div', { className: 'bg-white dark:bg-slate-900 w-full max-w-2xl rounded-3xl overflow-hidden shadow-2xl relative border border-teal-500/10 max-h-[90vh] flex flex-col animate-scale-in', onClick: e => e.stopPropagation() },
                        e('button', { onClick: () => setSelectedProject(null), className: 'absolute top-6 right-6 p-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-full text-slate-500 z-10' },
                            e(Icon, { name: 'x', className: 'w-4 h-4' })
                        ),
                        
                        e('div', { className: 'p-6 md:p-10 overflow-y-auto' },
                            e('div', { className: 'flex flex-wrap items-center gap-1.5 mb-4' },
                                selectedProject.days.map(d => e('span', { key: d, className: 'bg-brand-dark text-white text-[10px] font-black px-2.5 py-1 rounded-md uppercase tracking-wider' }, `Den: ${d}`)),
                                selectedProject.years.map(y => e('span', { key: y, className: 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 text-[10px] font-black px-2.5 py-1 rounded-md uppercase tracking-wider' }, `Určeno: ${y}`)),
                                e('span', { className: 'text-slate-400 dark:text-slate-500 font-bold uppercase text-[10px] tracking-wider ml-auto' }, selectedProject.leaderType)
                            ),
                            e('h2', { className: 'text-2xl md:text-3xl font-black leading-tight text-slate-900 dark:text-white mb-4 uppercase tracking-tight text-left' }, selectedProject.title),
                            
                            e('div', { className: 'space-y-6' },
                                e('div', null,
                                    e('h5', { className: 'text-[10px] font-black uppercase text-brand-medium dark:text-brand-light mb-2 tracking-widest text-left' }, 'Anotace projektu'),
                                    e('p', { className: 'text-slate-600 dark:text-slate-300 leading-relaxed text-sm font-medium text-left whitespace-pre-line' }, selectedProject.annotation)
                                ),
                                
                                selectedProject.warning && e('div', { className: 'p-4 bg-amber-50 dark:bg-amber-950/20 border border-amber-200 dark:border-amber-900/40 rounded-2xl text-left' },
                                    e('h5', { className: 'text-[10px] font-black uppercase text-amber-700 dark:text-amber-400 mb-1 tracking-widest flex items-center gap-1' }, 
                                        e(Icon, { name: 'alert-triangle', className: 'w-3 h-3' }), 'Důležité upozornění / Pomůcky'
                                    ),
                                    e('p', { className: 'text-xs font-semibold text-amber-900 dark:text-amber-300/90 leading-relaxed' }, selectedProject.warning)
                                ),

                                e('div', { className: 'grid grid-cols-1 sm:grid-cols-2 gap-4 pt-6 border-t border-slate-100 dark:border-slate-800/80 text-left' },
                                    e('div', null,
                                        e('h5', { className: 'text-[10px] font-black uppercase text-slate-400 dark:text-slate-500 mb-1 tracking-widest' }, 'Pro koho'),
                                        e('p', { className: 'text-xs font-bold text-slate-700 dark:text-slate-300' }, selectedProject.target)
                                    ),
                                    selectedProject.location && e('div', null,
                                        e('h5', { className: 'text-[10px] font-black uppercase text-slate-400 dark:text-slate-500 mb-1 tracking-widest' }, 'Místo konání'),
                                        e('p', { className: 'text-xs font-bold text-slate-700 dark:text-slate-300' }, selectedProject.location)
                                    ),
                                    e('div', null,
                                        e('h5', { className: 'text-[10px] font-black uppercase text-slate-400 dark:text-slate-500 mb-1 tracking-widest' }, 'Celková kapacita'),
                                        e('p', { className: 'text-xs font-bold text-slate-700 dark:text-slate-300' }, selectedProject.capacity)
                                    )
                                )
                            )
                        ),
                        e('div', { className: 'bg-slate-50 dark:bg-slate-900/40 p-4 flex justify-end gap-2 border-t border-slate-100 dark:border-slate-800/60' },
                            e('button', { onClick: () => setSelectedProject(null), className: 'bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400 px-6 py-2.5 rounded-xl font-black uppercase text-[11px] hover:bg-slate-300 dark:hover:bg-slate-700 transition-all tracking-wider' }, 'Zavřít detail')
                        )
                    )
                ),

                statusModal && e('div', { className: 'fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-sm', onClick: () => setStatusModal(false) },
                    e('div', { className: 'bg-white dark:bg-slate-900 w-full max-w-md rounded-3xl p-8 shadow-2xl relative text-center', onClick: e => e.stopPropagation() },
                        e('div', { className: `w-12 h-12 rounded-full mx-auto flex items-center justify-center mb-4 ${new Date() < openTime ? 'bg-amber-100 dark:bg-amber-950/40 text-amber-600' : 'bg-rose-100 dark:bg-rose-950/40 text-rose-600'}` },
                            e(Icon, { name: new Date() < openTime ? 'clock' : 'alert-circle', className: 'w-6 h-6' })
                        ),
                        e('h3', { className: 'text-xl font-black uppercase text-slate-900 dark:text-white mb-2' }, new Date() < openTime ? 'Zápis ještě nebyl spuštěn' : 'Zápis byl již ukončen'),
                        e('div', { className: 'space-y-2 text-sm text-slate-500 dark:text-slate-400 font-medium mb-6' },
                            e('p', null, 'Přihlašování probíhá pouze v určeném termínu:'),
                            e('div', { className: 'bg-slate-50 dark:bg-slate-800/40 p-3 rounded-xl text-xs font-bold text-slate-700 dark:text-slate-300 space-y-1' },
                                e('p', null, `Od: ${formatDateTime(openTime)}`),
                                e('p', null, `Do: ${formatDateTime(closeTime)}`)
                            )
                        ),
                        e('div', { className: 'flex flex-col gap-2' },
                            new Date() > closeTime && e('a', { href: formUrl, target: '_blank', className: 'bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 py-3 rounded-xl font-black uppercase text-xs tracking-wider transition-smooth hover:bg-slate-800 text-center' }, 'Zkusit otevřít formulář i tak'),
                            e('button', { onClick: () => setStatusModal(false), className: 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 py-3 rounded-xl font-black uppercase text-xs tracking-wider transition-smooth hover:bg-slate-200 dark:hover:bg-slate-700' }, 'Zavřít zprávu')
                        )
                    )
                ),

                e('div', { className: 'fixed bottom-8 right-8 z-40' },
                    e('button', {
                        onClick: handleApply,
                        className: 'bg-brand-yellow hover:bg-brand-yellowHover text-teal-950 px-6 py-3.5 rounded-full shadow-2xl transition-smooth flex items-center justify-center gap-2 group border border-teal-400/20'
                    },
                        e(Icon, { name: 'edit', className: 'w-5 h-5' }),
                        e('span', { className: 'font-black uppercase text-xs tracking-widest' }, 'Chci se přihlásit')
                    )
                ),

                e('footer', { className: 'max-w-6xl mx-auto px-4 py-12 border-t border-teal-100 dark:border-slate-800 text-center mt-12' },
                    e('p', { className: 'text-slate-400 dark:text-slate-500 text-xs font-black uppercase tracking-[0.3em] mb-2' }, 'Gymnázium Slaný • Projektové dny 2026')
                )
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(e(App));
    </script>
</body>
</html>
