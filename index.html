        const daySelect = document.getElementById('day-select');

        const modal = document.getElementById('modal');
        const modalContent = document.getElementById('modal-content');

            const openTime = new Date('2026-06-18T14:00:00');
            if (new Date() < openTime) {
                alert("Přihlašování bude spuštěno 18. 6. ve 14:00.");
            } else {
                window.open("https://forms.google.com", "_blank");
            }
        };

        // Vykreslení karet projektů (správný název funkce s malým r)
        function renderProjects() {
            const search = searchInput.value.toLowerCase();
            const selectedYear = yearSelect.value;
            const selectedDay = daySelect.value;
            const selectedLeader = leaderSelect.value;

            // Filtrování pole
            const filtered = PROJECTS_DATA.filter(p => {
                const matchesSearch = p.title.toLowerCase().includes(search) || p.annotation.toLowerCase().includes(search);

                const matchesDay = selectedDay === "ALL" || p.days.includes(selectedDay);
                const matchesLeader = selectedLeader === "ALL" || p.leaderType === selectedLeader;
                return matchesSearch && matchesYear && matchesDay && matchesLeader;
            });

            // Reset mřížky
            grid.innerHTML = '';

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                grid.classList.add('hidden');
            } else {
                emptyState.classList.add('hidden');
                grid.classList.remove('hidden');

                filtered.forEach(p => {
                    const card = document.createElement('div');
                    card.className = "bg-white dark:bg-slate-800 rounded-2xl border border-slate-100 dark:border-slate-700/60 shadow-md hover:shadow-xl transition-smooth p-6 flex flex-col justify-between cursor-pointer group hover:-translate-y-1";
                    
                    const dayBadges = p.days.map(d => `<span class="text-xs font-bold px-2.5 py-1 rounded-md border ${getDayBadgeColor(d)}">${d}</span>`).join(' ');

                    card.innerHTML = `
                        <div>
                            <div class="flex flex-wrap gap-2 mb-4">
                                ${dayBadges}
                                <span class="text-xs font-bold px-2.5 py-1 rounded-md border ${getLeaderBadgeColor(p.leaderType)}">${p.leaderType}</span>
                                <span class="text-xs font-bold bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 px-2.5 py-1 rounded-md">${p.years.join(" + ")}</span>
                            </div>
                            <h3 class="text-lg font-bold text-slate-900 dark:text-white group-hover:text-brand-medium dark:group-hover:text-brand-light transition-colors line-clamp-2 mb-2">${p.title}</h3>
                            <p class="text-xs text-slate-400 dark:text-slate-500 font-medium mb-3 flex items-center gap-1.5">
                                <i data-lucide="map-pin" class="w-3.5 h-3.5"></i>
                                <span>${p.location || "Budova školy / Areál"}</span>
                            </p>
                            <p class="text-slate-500 dark:text-slate-400 text-sm line-clamp-3 mb-4">${p.annotation}</p>
                        </div>
                        <div class="pt-4 border-t border-slate-50 dark:border-slate-700/50 flex items-center justify-between">
                            <div class="flex items-center gap-1.5 text-xs font-bold text-slate-500 dark:text-slate-400">
                                <i data-lucide="users" class="w-4 h-4 text-slate-400"></i>
                                <span>${p.capacity}</span>
                            </div>
                            <span class="text-xs font-black uppercase tracking-wider text-brand-medium dark:text-brand-light group-hover:translate-x-1 transition-transform flex items-center gap-1">
                                Detail projektu <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
                            </span>
                        </div>
                    `;

                    card.addEventListener('click', () => openModal(p));
                    grid.appendChild(card);
                });
            }

            if (window.lucide) {
                window.lucide.createIcons();
            }
        }

        // Správa modálního okna
        function openModal(project) {
            const dayBadges = project.days.map(d => `<span class="text-xs font-bold px-2.5 py-1 rounded-md border ${getDayBadgeColor(d)}">Den konání: ${d === "ST" ? "Středa" : "Čtvrtek"}</span>`).join(' ');
            
            let warningHTML = '';
            if (project.warning) {
                warningHTML = `
                    <div class="bg-amber-500/10 border border-amber-500/20 dark:border-amber-500/30 text-amber-800 dark:text-amber-300 p-4 rounded-2xl flex gap-3 items-start mt-4">
                        <i data-lucide="alert-triangle" class="w-5 h-5 text-amber-500 shrink-0 mt-0.5"></i>
                        <div>
                            <h5 class="font-bold text-xs uppercase tracking-wider mb-0.5">Důležité informace a požadavky</h5>
                            <p class="text-sm font-medium leading-normal">${project.warning}</p>
                        </div>
                    </div>
                `;
            }

            modalContent.innerHTML = `
                <div class="flex justify-between items-start gap-4 mb-4">
                    <div class="flex flex-wrap gap-2">
                        ${dayBadges}
                        <span class="text-xs font-bold px-2.5 py-1 rounded-md border ${getLeaderBadgeColor(project.leaderType)}">Vedení: ${project.leaderType}</span>
                        <span class="text-xs font-bold bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 px-2.5 py-1 rounded-md">Cílovka: ${project.years.join(" + ")}</span>
                    </div>
                    <button id="modal-close-top" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1 rounded-xl bg-slate-50 dark:bg-slate-700 transition-colors">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>

                <h2 class="text-2xl font-black text-slate-900 dark:text-white mb-2">${project.title}</h2>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6 bg-slate-50 dark:bg-slate-900/50 p-4 rounded-2xl border border-slate-100 dark:border-slate-800/60">
                    <div class="flex items-center gap-2.5 text-sm">
                        <i data-lucide="map-pin" class="w-4 h-4 text-brand-medium"></i>
                        <div>
                            <span class="block text-[10px] font-bold uppercase tracking-wider text-slate-400">Místo konání</span>
                            <span class="font-semibold text-slate-700 dark:text-slate-300">${project.location || "Budova školy / Areál"}</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-2.5 text-sm">
                        <i data-lucide="users" class="w-4 h-4 text-brand-medium"></i>
                        <div>
                            <span class="block text-[10px] font-bold uppercase tracking-wider text-slate-400">Maximální kapacita</span>
                            <span class="font-semibold text-slate-700 dark:text-slate-300">${project.capacity}</span>
                        </div>
                    </div>
                </div>

                <div class="space-y-4 text-sm leading-relaxed">
                    <div>
                        <h4 class="font-bold text-xs uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-1.5">Anotace projektu</h4>
                        <p class="text-slate-600 dark:text-slate-300 bg-slate-50/50 dark:bg-slate-900/20 p-3 rounded-xl border border-slate-100/50 dark:border-slate-800/30">${project.annotation}</p>
                    </div>
                    <div>
                        <h4 class="font-bold text-xs uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-1.5">Pro koho je projekt určen</h4>
                        <p class="text-slate-600 dark:text-slate-300">${project.target}</p>
                    </div>
                    ${warningHTML}
                </div>
            `;

            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            document.getElementById('modal-close-top').addEventListener('click', closeModal);
            if (window.lucide) window.lucide.createIcons();
        }

        function closeModal() {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        // Event Listenery
        searchInput.addEventListener('input', renderProjects);
        yearSelect.addEventListener('change', renderProjects);
        daySelect.addEventListener('change', renderProjects);
        leaderSelect.addEventListener('change', renderProjects);
        
        document.getElementById('modal-overlay').addEventListener('click', closeModal);
        document.getElementById('modal-close-footer').addEventListener('click', closeModal);
        
        document.getElementById('floating-apply-btn').addEventListener('click', handleApply);
        document.getElementById('modal-apply-btn').addEventListener('click', handleApply);

        // Zde byla chyba opravena: voláme přesný název "renderProjects" s malým "r"
        window.addEventListener('DOMContentLoaded', renderProjects);
    </script>
</body>
</html>
