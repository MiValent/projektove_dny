                                        </div>
                                    </div>
                                    <div className="px-6 py-3 bg-slate-50 dark:bg-slate-800/50 border-t border-slate-100 dark:border-slate-700/40 rounded-b-2xl flex items-center justify-between text-xs font-bold text-brand-medium dark:text-brand-light group-hover:bg-teal-50/50 dark:group-hover:bg-slate-700/30 transition-smooth">
                                        <span>Zobrazit detaily</span>
                                        <Icon name="arrow-right" className="w-4 h-4 transform group-hover:translate-x-1 transition-smooth" />
                                    </div>
                                </div>
                            ))}
                        </div>
                    </main>

                    {/* Modální okno s detailem projektu */}
                    {selectedProject && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={() => setSelectedProject(null)}>
                            <div 
                                className="bg-white dark:bg-slate-800 w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden animate-scale-in flex flex-col max-h-[90vh] border border-teal-500/10"
                                onClick={(e) => e.stopPropagation()}
                            >
                                {/* Hlavička modálu */}
                                <div className="p-6 bg-gradient-to-r from-teal-800 to-teal-900 text-white relative">
                                    <button 
                                        onClick={() => setSelectedProject(null)}
                                        className="absolute top-4 right-4 bg-black/20 hover:bg-black/40 text-white rounded-full p-1.5 transition-smooth"
                                    >
                                        <Icon name="x" className="w-4 h-4" />
                                    </button>
                                    <div className="flex flex-wrap gap-1.5 mb-2">
                                        {selectedProject.days.map(day => (
                                            <span key={day} className="bg-teal-600 text-white font-extrabold text-[10px] tracking-wider uppercase px-2 py-0.5 rounded-md">
                                                {day === 'ST' ? 'Středa' : 'Čtvrtek'}
                                            </span>
                                        ))}
                                        {selectedProject.years.map(year => (
                                            <span key={year} className="bg-white/20 text-teal-100 font-extrabold text-[10px] tracking-wider uppercase px-2 py-0.5 rounded-md">
                                                {year}
                                            </span>
                                        ))}
                                    </div>
                                    <h2 className="text-xl md:text-2xl font-black tracking-tight pr-6">{selectedProject.title}</h2>
                                </div>

                                {/* Obsah modálu */}
                                <div className="p-6 space-y-5 overflow-y-auto scrollbar-hide flex-1 text-sm leading-relaxed">
                                    {/* Hlavní anotace */}
                                    <div>
                                        <h4 className="text-xs font-black uppercase text-slate-400 dark:text-slate-500 tracking-wider mb-1.5">Popis projektu</h4>
                                        <p className="text-slate-700 dark:text-slate-200 font-medium">{selectedProject.annotation}</p>
                                    </div>

                                    {/* Cíl / Pro koho to je */}
                                    {selectedProject.target && (
                                        <div className="bg-slate-50 dark:bg-slate-900/60 p-4 rounded-xl border border-slate-100 dark:border-slate-700/50">
                                            <h4 className="text-xs font-black uppercase text-teal-700 dark:text-teal-400 tracking-wider mb-1 flex items-center gap-1.5">
                                                <Icon name="target" className="w-3.5 h-3.5" /> Pro koho je určen?
                                            </h4>
                                            <p className="text-slate-600 dark:text-slate-300 font-medium">{selectedProject.target}</p>
                                        </div>
                                    )}

                                    {/* Důležité upozornění */}
                                    {selectedProject.warning && (
                                        <div className="bg-amber-50 dark:bg-amber-950/20 p-4 rounded-xl border border-amber-100 dark:border-amber-900/30">
                                            <h4 className="text-xs font-black uppercase text-amber-800 dark:text-amber-400 tracking-wider mb-1 flex items-center gap-1.5">
                                                <Icon name="alert-triangle" className="w-3.5 h-3.5" /> Důležité informace a výbava
                                            </h4>
                                            <p className="text-slate-700 dark:text-amber-200/90 font-medium">{selectedProject.warning}</p>
                                        </div>
                                    )}

                                    {/* Specifikace */}
                                    <div className="grid grid-cols-2 gap-4 pt-2 border-t border-slate-100 dark:border-slate-700/60">
                                        <div className="space-y-1">
                                            <span className="block text-[10px] font-black uppercase text-slate-400 dark:text-slate-500 tracking-wider">Kapacita</span>
                                            <div className="flex items-center gap-2 font-bold text-slate-700 dark:text-slate-200">
                                                <Icon name="users" className="w-4 h-4 text-teal-600 dark:text-teal-400" />
                                                <span>{selectedProject.capacity}</span>
                                            </div>
                                        </div>
                                        <div className="space-y-1">
                                            <span className="block text-[10px] font-black uppercase text-slate-400 dark:text-slate-500 tracking-wider">Místo konání</span>
                                            <div className="flex items-center gap-2 font-bold text-slate-700 dark:text-slate-200">
                                                <Icon name="map-pin" className="w-4 h-4 text-teal-600 dark:text-teal-400" />
                                                <span className="truncate">{selectedProject.location || "Budova školy"}</span>
                                            </div>
                                        </div>
                                        <div className="space-y-1">
                                            <span className="block text-[10px] font-black uppercase text-slate-400 dark:text-slate-500 tracking-wider">Typ projektu</span>
                                            <div className="flex items-center gap-2 font-bold text-slate-700 dark:text-slate-200">
                                                <Icon name="user" className="w-4 h-4 text-teal-600 dark:text-teal-400" />
                                                <span className="capitalize">{selectedProject.leaderType}</span>
                                            </div>
                                        </div>
                                        <div className="space-y-1">
                                            <span className="block text-[10px] font-black uppercase text-slate-400 dark:text-slate-500 tracking-wider">Den</span>
                                            <div className="flex items-center gap-2 font-bold text-slate-700 dark:text-slate-200">
                                                <Icon name="calendar" className="w-4 h-4 text-teal-600 dark:text-teal-400" />
                                                <span>{selectedProject.days.map(d => d === 'ST' ? 'Středa' : 'Čtvrtek').join(' + ')}</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* Patička modálu s akčním tlačítkem */}
                                <div className="p-4 bg-slate-50 dark:bg-slate-900/40 border-t border-slate-100 dark:border-slate-700/60 flex items-center justify-end gap-3">
                                    <button 
                                        onClick={() => setSelectedProject(null)}
                                        className="px-4 py-2 text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 text-xs font-black uppercase tracking-wider transition-smooth"
                                    >
                                        Zavřít
                                    </button>
                                    <button 
                                        onClick={handleApply}
                                        className="bg-brand-yellow hover:bg-brand-yellowHover text-teal-950 px-5 py-2.5 rounded-xl font-black uppercase text-xs tracking-wider shadow-md transition-smooth flex items-center gap-2 border-b-2 border-yellow-600"
                                    >
                                        <Icon name="pen-tool" className="w-4 h-4" />
                                        Přihlásit se na projekt
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Plovoucí tlačítko "Chci se přihlásit" */}
                    <div className="fixed bottom-8 right-8 z-40">
                        <button 
                            onClick={handleApply}
                            className="bg-brand-yellow hover:bg-brand-yellowHover text-teal-950 px-6 py-3.5 rounded-full shadow-2xl transition-smooth flex items-center justify-center gap-2 group border border-teal-400/20 dark:border-yellow-500/30"
                        >
                            <Icon name="pen-tool" className="w-5 h-5" />
                            <span className="font-black uppercase text-xs tracking-widest">Chci se přihlásit</span>
                        </button>
                    </div>

                    {/* Patička */}
                    <footer className="max-w-6xl mx-auto px-4 py-12 border-t border-teal-100 dark:border-slate-800 text-center mt-12">
                        <p className="text-slate-400 dark:text-slate-500 text-xs font-black uppercase tracking-[0.3em] mb-2">Gymnázium Slaný • Projektové dny 2026</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
