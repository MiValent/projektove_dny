        // Inicializace webu
        document.addEventListener("DOMContentLoaded", () => {
            setupFilterListeners();
            renderProjects();
            
            // Vyhledávání
            document.getElementById("search-input").addEventListener("input", (e) => {
                filters.search = e.target.value;
                renderProjects();
                toggleResetButton();
            });

            // Reset filtrů
            document.getElementById("reset-filters").addEventListener("click", () => {
                filters = { year: 'ALL', day: 'ALL', leaderType: 'ALL', search: '' };
                document.getElementById("search-input").value = '';
                
                // Vizuální reset tlačítek
                resetActiveButtons("filter-year", "ALL");
                resetActiveButtons("filter-day", "ALL");
                resetActiveButtons("filter-leader", "ALL");
                
                renderProjects();
                toggleResetButton();
            });
        });

        // Nastavení klikání pro filtry
        function setupFilterListeners() {
            const setupGroup = (groupId, filterKey) => {
                const container = document.getElementById(groupId);
                container.querySelectorAll("button").forEach(btn => {
                    btn.addEventListener("click", () => {
                        container.querySelectorAll("button").forEach(b => {
                            b.className = "flex-1 text-center py-2 text-xs font-bold rounded-lg transition-smooth text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200";
                        });
                        btn.className = "flex-1 text-center py-2 text-xs font-bold rounded-lg transition-smooth bg-white dark:bg-slate-700 text-brand-dark dark:text-brand-light shadow-md border border-teal-100/50 dark:border-slate-600";
                        
                        filters[filterKey] = btn.getAttribute("data-value");
                        renderProjects();
                        toggleResetButton();
                    });
                });
            };

            setupGroup("filter-year", "year");
            setupGroup("filter-day", "day");
            setupGroup("filter-leader", "leaderType");
        }

        function resetActiveButtons(groupId, defaultValue) {
            const container = document.getElementById(groupId);
            container.querySelectorAll("button").forEach(b => {
                if(b.getAttribute("data-value") === defaultValue) {
                    b.className = "flex-1 text-center py-2 text-xs font-bold rounded-lg transition-smooth bg-white dark:bg-slate-700 text-brand-dark dark:text-brand-light shadow-md border border-teal-100/50 dark:border-slate-600";
                } else {
                    b.className = "flex-1 text-center py-2 text-xs font-bold rounded-lg transition-smooth text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200";
                }
            });
        }

        function toggleResetButton() {
            const btn = document.getElementById("reset-filters");
            if (filters.year !== 'ALL' || filters.day !== 'ALL' || filters.leaderType !== 'ALL' || filters.search) {
                btn.classList.remove("hidden");
            } else {
                btn.classList.add("hidden");
            }
        }

                const matchYear = filters.year === 'ALL' || project.years.includes(filters.year);
                const matchDay = filters.day === 'ALL' || project.days.includes(filters.day);
                const matchLeader = filters.leaderType === 'ALL' || project.leaderType === filters.leaderType;
                
                const searchLower = filters.search.toLowerCase();
                const matchSearch = !filters.search || 
                    project.title.toLowerCase().includes(searchLower) ||
                    (project.annotation && project.annotation.toLowerCase().includes(searchLower)) ||
                    (project.location && project.location.toLowerCase().includes(searchLower));

                return matchYear && matchDay && matchLeader && matchSearch;
            });

            filtered.forEach(project => {
                const card = document.createElement("div");
                card.className = "bg-white dark:bg-slate-800 rounded-2xl md:rounded-3xl border border-teal-100/60 dark:border-slate-700/60 shadow-sm hover:shadow-xl hover:border-brand-medium/30 dark:hover:border-brand-medium/30 transition-all duration-300 p-5 md:p-6 flex flex-col justify-between cursor-pointer group relative overflow-hidden";

                let leaderColor = project.leaderType === 'učitel' ? 'bg-blue-50 dark:bg-blue-950/40 text-blue-600' : project.leaderType === 'studentský' ? 'bg-purple-50 dark:bg-purple-950/40 text-purple-600' : 'bg-amber-50 dark:bg-amber-950/40 text-amber-600';

                            <span class="truncate">${project.location || 'Budova školy'}</span>
                        </div>
                        <span class="text-brand-medium dark:text-brand-light font-black uppercase text-[10px] tracking-widest flex items-center gap-1 flex-shrink-0">
                            Detail <svg class="w-3 h-3 group-hover:translate-x-1 transition-smooth" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Otevření detailu v modálu
        function openModal(project) {
            const modal = document.getElementById("project-modal");
            const container = modal.querySelector(".bg-white");

            let daysHtml = project.days.map(d => `<span class="bg-brand-medium/10 text-brand-dark dark:text-brand-light px-2.5 py-1 rounded-lg text-[10px] font-black uppercase tracking-wider">${d === 'ST' ? 'Středa' : 'Čtvrtek'}</span>`).join(" ");
            let yearsHtml = project.years.map(y => `<span class="bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 px-2.5 py-1 rounded-lg text-[10px] font-black uppercase tracking-wider">${y}</span>`).join(" ");

            let targetHtml = project.target ? `
                <div class="flex gap-3 bg-blue-50/50 dark:bg-blue-950/20 border border-blue-100 dark:border-blue-900/50 p-4 rounded-xl">
                    <svg class="w-5 h-5 text-blue-500 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <div>
                        <h4 class="text-xs font-black uppercase tracking-wider text-blue-600 dark:text-blue-400 mb-0.5">Pro koho je projekt vhodný</h4>
                        <p class="text-slate-600 dark:text-slate-300 text-sm font-medium leading-relaxed">${project.target}</p>
                    </div>
                </div>
            ` : '';

            let warningHtml = project.warning ? `
                <div class="flex gap-3 bg-amber-50/50 dark:bg-amber-950/20 border border-amber-100 dark:border-amber-900/50 p-4 rounded-xl">
                    <svg class="w-5 h-5 text-amber-500 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                    <div>
                        <h4 class="text-xs font-black uppercase tracking-wider text-amber-600 dark:text-amber-400 mb-0.5">Důležité informace a výbava</h4>
                        <p class="text-slate-600 dark:text-slate-300 text-sm font-medium leading-relaxed">${project.warning}</p>
                    </div>
                </div>
            ` : '';

            container.innerHTML = `
                <div class="p-6 border-b border-slate-100 dark:border-slate-700 flex justify-between items-start gap-4">
                    <div>
                        <div class="flex flex-wrap gap-2 mb-2">
                            ${daysHtml}
                            ${yearsHtml}
                        </div>
                        <h2 class="text-2xl font-black text-slate-900 dark:text-white leading-tight">${project.title}</h2>
                    </div>
                    <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1.5 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl transition-smooth">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>

                <div class="p-6 overflow-y-auto space-y-6 scrollbar-hide">
                    
                    <div class="grid grid-cols-2 gap-4 bg-slate-50 dark:bg-slate-900/50 p-4 rounded-xl md:rounded-2xl border border-slate-100 dark:border-slate-700/60">
                        <div class="flex gap-2.5">
                            <div class="w-8 h-8 rounded-lg bg-teal-500/10 text-brand-medium dark:text-brand-light flex items-center justify-center flex-shrink-0">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                            </div>
                            <div>
                                <span class="block text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-wider">Kapacita</span>
                                <span class="text-sm font-bold text-slate-700 dark:text-slate-300">${project.capacity || 'Nespecifikováno'}</span>
                            </div>
                        </div>
                        <div class="flex gap-2.5">
                            <div class="w-8 h-8 rounded-lg bg-teal-500/10 text-brand-medium dark:text-brand-light flex items-center justify-center flex-shrink-0">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                            </div>
                            <div class="truncate">
                                <span class="block text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-wider">Místo konání</span>
                                <span class="text-sm font-bold text-slate-700 dark:text-slate-300 truncate block">${project.location || 'Budova školy'}</span>
                            </div>
                        </div>
                        <div class="flex gap-2.5 col-span-2 pt-2 border-t border-slate-200/50 dark:border-slate-700/50">
                            <div class="w-8 h-8 rounded-lg bg-teal-500/10 text-brand-medium dark:text-brand-light flex items-center justify-center flex-shrink-0">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                            </div>
                            <div>
                                <span class="block text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-wider">Typ vedení projektu</span>
                                <span class="text-sm font-bold text-slate-700 dark:text-slate-300 uppercase text-[11px] tracking-wide">${project.leaderType}</span>
                            </div>
                        </div>
                    </div>

                    <div>
                        <h4 class="text-[11px] font-black uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-2">Anotace projektu</h4>
                        <p class="text-slate-600 dark:text-slate-300 text-sm font-medium leading-relaxed bg-slate-50/50 dark:bg-slate-900/20 p-4 rounded-xl border border-slate-100/50 dark:border-slate-800">${project.annotation}</p>
                    </div>

                    ${targetHtml}
                    ${warningHtml}
                </div>

                <div class="bg-slate-50 dark:bg-slate-900/40 p-4 flex justify-center items-center border-t border-slate-100 dark:border-slate-700">
                    <button onclick="closeModal()" class="w-full sm:w-auto bg-slate-200 hover:bg-slate-300 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 px-8 py-3 rounded-xl font-black uppercase text-xs transition-smooth tracking-widest">
                        Zavřít detail
                    </button>
                </div>
            `;
            modal.classList.remove("hidden");
        }

        function closeModal() {
            document.getElementById("project-modal").classList.add("hidden");
        }
    </script>
</body>
</html>
